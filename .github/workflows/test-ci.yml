name: Test CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build application and run unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: open-data-recovery-ci:latest
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
      - name: Build pinned optional engines
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/engines/Dockerfile
          load: true
          tags: open-data-recovery-engines:latest
          cache-from: type=gha,scope=engines
          cache-to: type=gha,mode=max,scope=engines
      - name: Check formatting, GTK and real recovery engines
        run: sh scripts/ci.sh check
